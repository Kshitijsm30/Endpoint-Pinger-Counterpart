<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endpoint Pinger</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #0f0f0f;
        color: #e0e0e0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 40px 16px;
      }

      .container {
        width: 100%;
        max-width: 640px;
      }

      h1 {
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 8px;
        color: #ffffff;
      }

      .subtitle {
        color: #888;
        font-size: 0.9rem;
        margin-bottom: 32px;
      }

      /* ── Add URL form ──────────────────────────────── */
      .add-form {
        display: flex;
        gap: 10px;
        margin-bottom: 32px;
      }

      .add-form input {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        background: #1a1a1a;
        color: #e0e0e0;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s;
      }

      .add-form input:focus {
        border-color: #4f8cff;
      }

      .add-form input::placeholder {
        color: #555;
      }

      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
      }

      .btn:active {
        transform: scale(0.97);
      }

      .btn-primary {
        background: #4f8cff;
        color: #fff;
      }

      .btn-primary:hover {
        background: #3a73e0;
      }

      .btn-danger {
        background: transparent;
        color: #ff5f5f;
        padding: 6px 14px;
        font-size: 0.82rem;
        border: 1px solid #3a1a1a;
        border-radius: 6px;
      }

      .btn-danger:hover {
        background: #2a1010;
      }

      /* ── URL list ──────────────────────────────────── */
      .section-title {
        font-size: 1rem;
        font-weight: 600;
        color: #aaa;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .url-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .url-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 18px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 10px;
        transition: border-color 0.2s;
      }

      .url-card:hover {
        border-color: #333;
      }

      .url-info {
        overflow: hidden;
        margin-right: 12px;
      }

      .url-text {
        font-size: 0.95rem;
        color: #e0e0e0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .url-date {
        font-size: 0.75rem;
        color: #666;
        margin-top: 4px;
      }

      .empty-state {
        text-align: center;
        padding: 48px 16px;
        color: #555;
        font-size: 0.95rem;
      }

      .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 500;
        color: #fff;
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.3s, transform 0.3s;
        z-index: 1000;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      .toast.success {
        background: #1a7a3a;
      }

      .toast.error {
        background: #8a2020;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>⚡ Endpoint Pinger</h1>
      <p class="subtitle">
        Add URLs to keep them alive at <a href="https://endpoint-pinger.onrender.com">Original Site</a>. Each URL is pinged every 4–6 minutes.
      </p>

    <script>
      const urlInput = document.getElementById("urlInput");
      const addBtn = document.getElementById("addBtn");
      const urlList = document.getElementById("urlList");
      const toast = document.getElementById("toast");

      // ── Toast notification ────────────────────────
      function showToast(message, type = "success") {
        toast.textContent = message;
        toast.className = `toast ${type} show`;
        setTimeout(() => toast.classList.remove("show"), 3000);
      }

      // ── Render the URL list ───────────────────────
      function renderList(entries) {
        if (!entries.length) {
          urlList.innerHTML =
            '<div class="empty-state">No URLs added yet. Add one above!</div>';
          return;
        }

        urlList.innerHTML = entries
          .map(
            (e) => `
          <div class="url-card">
            <div class="url-info">
              <div class="url-text">${escapeHtml(e.url)}</div>
              <div class="url-date">Added ${new Date(e.createdAt).toLocaleString()}</div>
            </div>
            <button class="btn btn-danger" onclick="deleteUrl('${e.id}')">Delete</button>
          </div>`
          )
          .join("");
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      // ── Fetch URLs ────────────────────────────────
      async function loadUrls() {
        try {
          const res = await fetch("/api/urls");
          const data = await res.json();
          renderList(data);
        } catch {
          urlList.innerHTML =
            '<div class="empty-state">Failed to load URLs.</div>';
        }
      }

      // ── Add URL ───────────────────────────────────
      async function addUrl() {
        const url = urlInput.value.trim();
        if (!url) return showToast("Please enter a URL", "error");

        addBtn.disabled = true;
        addBtn.textContent = "Adding…";

        try {
          const res = await fetch("/api/urls", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url }),
          });

          const data = await res.json();

          if (!res.ok) {
            showToast(data.error || "Failed to add URL", "error");
          } else {
            urlInput.value = "";
            showToast("URL added successfully!");
            loadUrls();
          }
        } catch {
          showToast("Network error", "error");
        } finally {
          addBtn.disabled = false;
          addBtn.textContent = "Add URL";
        }
      }

      // ── Delete URL ────────────────────────────────
      async function deleteUrl(id) {
        if (!confirm("Remove this URL?")) return;

        try {
          const res = await fetch(`/api/urls/${id}`, { method: "DELETE" });
          const data = await res.json();

          if (!res.ok) {
            showToast(data.error || "Failed to delete", "error");
          } else {
            showToast("URL removed");
            loadUrls();
          }
        } catch {
          showToast("Network error", "error");
        }
      }

      // ── Event listeners ───────────────────────────
      addBtn.addEventListener("click", addUrl);
      urlInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addUrl();
      });

      // ── Init ──────────────────────────────────────
      loadUrls();
    </script>
  </body>
</html>
